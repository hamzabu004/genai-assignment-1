services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Host bind mounts (uncomment if repository is located inside /home and live weight reloading is desired):
    # volumes:
    #   - ./backend/models:/app/models
    #   - ./research/val_manifest_official.json:/app/validation/val_manifest_official.json:ro
    #   - ./research/datasets/oxford-iiit-pet/images:/app/validation/images:ro
    environment:
      VALIDATION_MANIFEST_PATH: /app/validation/val_manifest_official.json
      VALIDATION_IMAGE_DIR: /app/validation/images
    env_file:
      - ./backend/.env.example

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
